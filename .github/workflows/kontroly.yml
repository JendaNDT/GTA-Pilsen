name: Kontroly

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rychle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r tools/requirements.txt
      - run: npm run test:python

  prohlizec:
    if: github.event_name == 'pull_request'
    needs: rychle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Základní zkoušky hry ve WebGL 2
        run: npx playwright test --grep @zaklad --project=webgl2 --trace off --reporter=github,html
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: zakladni-prohlizecove-zkousky
          path: |
            test-results/
            playwright-report/
          retention-days: 7
