name: Kontroly projektu

# Úplné kontroly běží jednou pro každý pull request a po sloučení do main.
# Změny jen v dokumentaci je přeskočí; ty ověřuje docs.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# Novější nahrání do stejného pull requestu zruší starší rozběhnutou kontrolu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.19.0, 22.12.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/requirements.txt
      - run: npm test
      - run: npm run test:python
      - run: python -m py_compile tools/*.py
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - if: matrix.node == 24
        name: Ověřit WebGPU na virtuální obrazovce
        run: xvfb-run -a npm run test:e2e -- --project=webgpu --headed --trace off --output=test-results/webgpu
      - if: matrix.node == 24
        name: Ověřit WebGL 2
        run: npm run test:e2e -- --project=webgl2 --trace off --output=test-results/webgl2
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.node == 24
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
