<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Plzeň naplno – skutečná Plzeň jako otevřený svět</title>
  <meta name="description" content="Projeď se po skutečné Plzni: ulice, domy, tramvaje i katedrála podle otevřených dat. Zdarma v prohlížeči, na počítači i na mobilu." />
  <meta name="theme-color" content="#101820" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101820'/%3E%3Cpath d='M30 8l4 0 3 22h8l2 26H17l2-26h8z' fill='%23f2b632'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="topleft">
      <div id="money">0 Kč</div>
      <div id="wanted" title="Hledanost"></div>
      <div id="health"><i></i></div>
    </div>
    <div id="mapwrap">
      <canvas id="minimap" width="220" height="220"></canvas>
      <div id="clock">10:00</div>
    </div>
    <div id="place"><b id="street"></b><span id="district"></span></div>
    <div id="mission" class="hidden"></div>
    <div id="toast"></div>
    <div id="prompt" class="hidden"></div>
    <div id="speedo" class="hidden"><b id="kmh">0</b><span>km/h</span><em id="vehname"></em></div>
    <div id="touch" class="hidden">
      <div id="stick"><i></i></div>
      <button id="tb-act" class="tb">F</button>
      <button id="tb-gas" class="tb">▲</button>
      <button id="tb-brake" class="tb">▼</button>
      <button id="tb-hand" class="tb">⎵</button>
      <button id="tb-job" class="tb">✉</button>
      <button id="tb-map" class="tb">🗺</button>
    </div>
    <button id="btn-menu" title="Menu">☰</button>
  </div>

  <div id="bigmap" class="hidden">
    <canvas id="bigmap-canvas"></canvas>
    <div id="bigmap-legend"></div>
    <button id="bigmap-close">Zavřít mapu</button>
  </div>

  <div id="menu">
    <div id="menu-card">
      <h1>Plzeň <span>naplno</span></h1>
      <p class="sub">Skutečná Plzeň jako otevřený svět</p>
      <div id="loading">
        <div id="bar"><i></i></div>
        <div id="loadtext">Načítám město…</div>
      </div>
      <div id="menu-buttons" class="hidden">
        <button id="btn-play" class="primary">Hrát</button>
        <button id="btn-help">Ovládání</button>
        <button id="btn-about">O hře</button>
        <button id="btn-reset" class="ghost">Začít od začátku</button>
      </div>
      <div id="rotate-tip">Tip: otoč telefon na šířku, hraje se to líp.</div>
      <div id="panel-help" class="panel hidden"></div>
      <div id="panel-about" class="panel hidden"></div>
    </div>
    <div id="credits">Mapová data © přispěvatelé OpenStreetMap (ODbL) · Výškopis © ČÚZK</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
